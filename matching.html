<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>지역 정보 입력</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background: white;
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
        }

        .overlay {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(0, 0, 0, 0.5);
            backdrop-filter: blur(5px);
            display: flex;
            justify-content: center;
            align-items: center;
            z-index: 1000;
        }

        .popup {
            background: white;
            border-radius: 20px;
            padding: 40px;
            max-width: 500px;
            width: 90%;
            box-shadow: 0 20px 60px rgba(0, 0, 0, 0.3);
            animation: slideUp 0.3s ease-out;
        }

        @keyframes slideUp {
            from {
                opacity: 0;
                transform: translateY(30px);
            }
            to {
                opacity: 1;
                transform: translateY(0);
            }
        }

        .popup h2 {
            color: #333;
            margin-bottom: 10px;
            font-size: 28px;
        }

        .popup p {
            color: #666;
            margin-bottom: 30px;
            font-size: 14px;
        }

        .form-group {
            margin-bottom: 20px;
        }

        .form-group label {
            display: block;
            margin-bottom: 8px;
            color: #555;
            font-weight: 600;
            font-size: 14px;
        }

        .form-group input,
        .form-group textarea,
        .form-group select {
            width: 100%;
            padding: 12px 15px;
            border: 2px solid #e0e0e0;
            border-radius: 10px;
            font-size: 15px;
            transition: all 0.3s;
            font-family: inherit;
        }

        .form-group input:focus,
        .form-group textarea:focus,
        .form-group select:focus {
            outline: none;
            border-color: #667eea;
            box-shadow: 0 0 0 3px rgba(102, 126, 234, 0.1);
        }

        .form-group select {
            cursor: pointer;
            background-color: white;
        }

        .form-group textarea {
            resize: vertical;
            min-height: 100px;
        }

        .location-inputs {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 10px;
        }

        .submit-btn {
            width: 100%;
            padding: 15px;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white;
            border: none;
            border-radius: 10px;
            font-size: 16px;
            font-weight: 600;
            cursor: pointer;
            transition: transform 0.2s, box-shadow 0.2s;
            margin-top: 10px;
        }

        .submit-btn:hover {
            transform: translateY(-2px);
            box-shadow: 0 10px 20px rgba(102, 126, 234, 0.3);
        }

        .submit-btn:active {
            transform: translateY(0);
        }

        .content {
            display: none;
            text-align: center;
            color: #333;
            padding: 40px 20px;
            max-width: 800px;
            width: 100%;
        }

        .content.active {
            display: block;
        }

        .content h1 {
            font-size: 36px;
            margin-bottom: 40px;
            color: #333;
        }

        .staff-profile {
            background: #f8f9fa;
            border-radius: 20px;
            padding: 40px;
            box-shadow: 0 10px 30px rgba(0, 0, 0, 0.1);
            margin-bottom: 30px;
        }

        .staff-image {
            width: 150px;
            height: 150px;
            border-radius: 50%;
            object-fit: cover;
            margin: 0 auto 20px;
            border: 5px solid white;
            box-shadow: 0 5px 15px rgba(0, 0, 0, 0.2);
        }

        .staff-info {
            margin-top: 20px;
        }

        .staff-info h3 {
            font-size: 24px;
            color: #333;
            margin-bottom: 10px;
        }

        .staff-info p {
            font-size: 16px;
            color: #666;
            margin: 8px 0;
            line-height: 1.6;
        }

        .info-badge {
            display: inline-block;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white;
            padding: 8px 16px;
            border-radius: 20px;
            font-size: 14px;
            margin: 5px;
            font-weight: 600;
        }

        .location-info {
            background: white;
            border-radius: 15px;
            padding: 20px;
            margin-top: 20px;
            border: 2px solid #e0e0e0;
        }

        .location-info p {
            font-size: 16px;
            color: #555;
            margin: 10px 0;
        }

        .overlay.hidden {
            display: none;
        }
    </style>
</head>
<body>
    <div class="overlay" id="overlay">
        <div class="popup">
            <h2>환영합니다!</h2>
            <p>직원 매칭전에 간단한 정보를 입력해주세요</p>
            
            <div class="form-group">
                <label>지역 정보</label>
                <div class="location-inputs">
                    <select id="province" required onchange="updateDistricts()">
                        <option value="">도/광역시 선택</option>
                        <option value="서울특별시">서울특별시</option>
                        <option value="부산광역시">부산광역시</option>
                        <option value="대구광역시">대구광역시</option>
                        <option value="인천광역시">인천광역시</option>
                        <option value="광주광역시">광주광역시</option>
                        <option value="대전광역시">대전광역시</option>
                        <option value="울산광역시">울산광역시</option>
                        <option value="세종특별자치시">세종특별자치시</option>
                        <option value="경기도">경기도</option>
                        <option value="강원도">강원도</option>
                        <option value="충청북도">충청북도</option>
                        <option value="충청남도">충청남도</option>
                        <option value="전라북도">전라북도</option>
                        <option value="전라남도">전라남도</option>
                        <option value="경상북도">경상북도</option>
                        <option value="경상남도">경상남도</option>
                        <option value="제주특별자치도">제주특별자치도</option>
                    </select>
                    <select id="district" required>
                        <option value="">시/군/구 선택</option>
                    </select>
                </div>
            </div>

            <div class="form-group">
                <label>내용</label>
                <textarea id="content" placeholder="자유롭게 내용을 입력해주세요..." required></textarea>
            </div>

            <button class="submit-btn" onclick="submitForm()">시작하기</button>
        </div>
    </div>

    <div class="content" id="mainContent">
        <h1>직원이 매칭 되었습니다!</h1>
        
        <div class="staff-profile">
            <img src="img/staff_img.png" alt="직원 프로필" class="staff-image">
            
            <div class="staff-info">
                <h3>김민수 매니저</h3>
                <div>
                    <span class="info-badge">5년 경력</span>
                    <span class="info-badge">전문 상담사</span>
                    <span class="info-badge">고객 만족도 98%</span>
                </div>
                <p style="margin-top: 20px; color: #555;">
                    안녕하세요! 고객님의 지역을 담당하는 김민수입니다.<br>
                    최선을 다해 도와드리겠습니다.
                </p>
            </div>
        </div>

        <div class="location-info" id="infoDisplay"></div>
    </div>

    <script>
        const locationData = {
            "서울특별시": ["강남구", "강동구", "강북구", "강서구", "관악구", "광진구", "구로구", "금천구", "노원구", "도봉구", "동대문구", "동작구", "마포구", "서대문구", "서초구", "성동구", "성북구", "송파구", "양천구", "영등포구", "용산구", "은평구", "종로구", "중구", "중랑구"],
            "부산광역시": ["강서구", "금정구", "남구", "동구", "동래구", "부산진구", "북구", "사상구", "사하구", "서구", "수영구", "연제구", "영도구", "중구", "해운대구", "기장군"],
            "대구광역시": ["남구", "달서구", "동구", "북구", "서구", "수성구", "중구", "달성군"],
            "인천광역시": ["계양구", "남동구", "동구", "미추홀구", "부평구", "서구", "연수구", "중구", "강화군", "옹진군"],
            "광주광역시": ["광산구", "남구", "동구", "북구", "서구"],
            "대전광역시": ["대덕구", "동구", "서구", "유성구", "중구"],
            "울산광역시": ["남구", "동구", "북구", "중구", "울주군"],
            "세종특별자치시": ["세종시"],
            "경기도": ["수원시 장안구", "수원시 권선구", "수원시 팔달구", "수원시 영통구", "고양시 덕양구", "고양시 일산동구", "고양시 일산서구", "용인시 처인구", "용인시 기흥구", "용인시 수지구", "성남시 수정구", "성남시 중원구", "성남시 분당구", "부천시", "안산시 단원구", "안산시 상록구", "안양시 만안구", "안양시 동안구", "남양주시", "화성시", "평택시", "의정부시", "시흥시", "파주시", "김포시", "광명시", "광주시", "군포시", "오산시", "이천시", "양주시", "안성시", "구리시", "포천시", "의왕시", "하남시", "여주시", "동두천시", "과천시", "양평군", "가평군", "연천군"],
            "강원도": ["춘천시", "원주시", "강릉시", "동해시", "태백시", "속초시", "삼척시", "홍천군", "횡성군", "영월군", "평창군", "정선군", "철원군", "화천군", "양구군", "인제군", "고성군", "양양군"],
            "충청북도": ["청주시 상당구", "청주시 서원구", "청주시 흥덕구", "청주시 청원구", "충주시", "제천시", "보은군", "옥천군", "영동군", "증평군", "진천군", "괴산군", "음성군", "단양군"],
            "충청남도": ["천안시 동남구", "천안시 서북구", "공주시", "보령시", "아산시", "서산시", "논산시", "계룡시", "당진시", "금산군", "부여군", "서천군", "청양군", "홍성군", "예산군", "태안군"],
            "전라북도": ["전주시 완산구", "전주시 덕진구", "군산시", "익산시", "정읍시", "남원시", "김제시", "완주군", "진안군", "무주군", "장수군", "임실군", "순창군", "고창군", "부안군"],
            "전라남도": ["목포시", "여수시", "순천시", "나주시", "광양시", "담양군", "곡성군", "구례군", "고흥군", "보성군", "화순군", "장흥군", "강진군", "해남군", "영암군", "무안군", "함평군", "영광군", "장성군", "완도군", "진도군", "신안군"],
            "경상북도": ["포항시 남구", "포항시 북구", "경주시", "김천시", "안동시", "구미시", "영주시", "영천시", "상주시", "문경시", "경산시", "군위군", "의성군", "청송군", "영양군", "영덕군", "청도군", "고령군", "성주군", "칠곡군", "예천군", "봉화군", "울진군", "울릉군"],
            "경상남도": ["창원시 의창구", "창원시 성산구", "창원시 마산합포구", "창원시 마산회원구", "창원시 진해구", "진주시", "통영시", "사천시", "김해시", "밀양시", "거제시", "양산시", "의령군", "함안군", "창녕군", "고성군", "남해군", "하동군", "산청군", "함양군", "거창군", "합천군"],
            "제주특별자치도": ["제주시", "서귀포시"]
        };

        function updateDistricts() {
            const province = document.getElementById('province').value;
            const districtSelect = document.getElementById('district');
            
            districtSelect.innerHTML = '<option value="">시/군/구 선택</option>';
            
            if (province && locationData[province]) {
                const districts = locationData[province];
                districts.forEach(district => {
                    const option = document.createElement('option');
                    option.value = district;
                    option.textContent = district;
                    districtSelect.appendChild(option);
                });
            }
        }

        function submitForm() {
            const province = document.getElementById('province').value;
            const district = document.getElementById('district').value;
            const content = document.getElementById('content').value.trim();

            if (!province || !district || !content) {
                alert('모든 항목을 입력해주세요!');
                return;
            }

            const location = `${province} ${district}`;
            
            document.getElementById('overlay').classList.add('hidden');
            document.getElementById('mainContent').classList.add('active');
            
            document.getElementById('infoDisplay').innerHTML = `
                <p><strong>📍 담당 지역:</strong> ${location}</p>
                <p><strong>📝 요청 내용:</strong> ${content}</p>
            `;
        }
    </script>
</body>
</html>
