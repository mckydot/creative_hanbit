<!DOCTYPE html>
<html lang="ko">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>한빛모아 || 메인 페이지</title>
    <link rel="stylesheet" href="./css/style.css">
    <link rel="stylesheet" href="./css/main.css">
    <script src="https://unpkg.com/lucide@latest"></script>
</head>

<body>
    <!-- ✅ 상단 내브바 -->
    <header class="navbar">
        <div class="navbar-left">
            <h1 class="app-name">한빛모아</h1>
        </div>

        <div class="navbar-right">
            <button class="icon-btn" id="mypage-btn" aria-label="마이페이지">
                <i data-lucide="user"></i>
            </button>
            <button class="icon-btn" id="settings-btn" aria-label="설정">
                <i data-lucide="settings"></i>
            </button>
        </div>
    </header>

    <!-- ✅ 검색창 -->
    <section class="search-section">
        <div class="search-box">
            <i data-lucide="search" class="search-icon"></i>
            <input type="text" id="searchInput" placeholder="검색어를 입력하세요" />
        </div>
    </section>

    <!-- ✅ 카테고리 선택 섹션 -->
    <section class="category-section">
        <div class="category-scroll">
            <button class="category-btn active">전체</button>
            <button class="category-btn">카테고리1</button>
            <button class="category-btn">카테고리2</button>
            <button class="category-btn">카테고리3</button>
            <button class="category-btn">카테고리4</button>
            <button class="category-btn">카테고리5</button>
        </div>
    </section>


    <main class="content">
        <section class="job-list">
            <!-- 카드 1 -->
            <article class="job-card">
                <h3 class="job-title">빽다방 유성센트럴 금마감, 토미들 모집합니다</h3>
                <div class="job-tags">
                    <span class="tag">1호선 유성온천역</span>
                    <span class="tag">장기근무</span>
                </div>
                <div class="job-info">
                    <p><i data-lucide="map-pin"></i> 대전 유성구 봉명동</p>
                    <p><i data-lucide="clock"></i> 금, 토 (협의가능)</p>
                </div>
                <p class="job-pay">시급 <strong>10,030원</strong></p>
                <p class="job-date">1시간 전</p>
            </article>

            <!-- 카드 2 -->
            <article class="job-card">
                <h3 class="job-title">투썸플레이스 둔산점 주말 아르바이트 모집</h3>
                <div class="job-tags">
                    <span class="tag">둔산역 근처</span>
                    <span class="tag">주말근무</span>
                </div>
                <div class="job-info">
                    <p><i data-lucide="map-pin"></i> 대전 서구 둔산동</p>
                    <p><i data-lucide="clock"></i> 토, 일 | 시간협의</p>
                </div>
                <p class="job-pay">시급 <strong>10,500원</strong></p>
                <p class="job-date">3시간 전</p>
            </article>

            <!-- 카드 3 -->
            <article class="job-card">
                <h3 class="job-title">한빛서점 주중 오후 알바 구합니다</h3>
                <div class="job-tags">
                    <span class="tag">시청역 근처</span>
                    <span class="tag">평일근무</span>
                </div>
                <div class="job-info">
                    <p><i data-lucide="map-pin"></i> 대전 서구 둔산동</p>
                    <p><i data-lucide="clock"></i> 월~금 | 14:00~18:00</p>
                </div>
                <p class="job-pay">시급 <strong>9,860원</strong></p>
                <p class="job-date">어제</p>
            </article>
        </section>
    </main>


    <!-- ✅ 하단 내브바 -->
    <nav class="bottom-nav">
        <button class="bottom-btn" id="ai-btn" aria-label="AI 기능">
            <i data-lucide="bot"></i>
            <span>AI</span>
        </button>

        <button class="bottom-btn" id="calendar-btn" aria-label="달력">
            <i data-lucide="calendar"></i>
            <span>달력</span>
        </button>

        <button class="bottom-btn home-btn" id="home-btn" aria-label="홈">
            <div class="home-icon">
                <i data-lucide="home"></i>
            </div>
        </button>

        <button class="bottom-btn" id="mypage-btn2" aria-label="마이페이지">
            <i data-lucide="user"></i>
            <span>마이</span>
        </button>

        <button class="bottom-btn" id="settings-btn2" aria-label="설정">
            <i data-lucide="settings"></i>
            <span>설정</span>
        </button>
    </nav>


    <script src="./js/main.js">
    </script>
</body>

</html>
