<!DOCTYPE html>
<html lang="ko">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>한빛모아 || 메인 페이지</title>
    <link rel="stylesheet" href="./css/style.css">
    <link rel="stylesheet" href="./css/main.css">
    <script src="https://unpkg.com/lucide@latest"></script>
</head>

<body>
    <!-- ✅ 상단 내브바 -->
    <header class="navbar">
        <div class="navbar-left">
            <h1 class="app-name">한빛모아</h1>
        </div>

        <div class="navbar-right">
            <button class="icon-btn" id="mypage-btn" aria-label="마이페이지">
                <i data-lucide="user"></i>
            </button>
            <button class="icon-btn" id="settings-btn" aria-label="설정">
                <i data-lucide="settings"></i>
            </button>
        </div>
    </header>

    <!-- ✅ 검색창 -->
    <section class="search-section">
        <div class="search-box">
            <i data-lucide="search" class="search-icon"></i>
            <input type="text" id="searchInput" placeholder="검색어를 입력하세요" />
        </div>
    </section>

    <!-- ✅ 메인 콘텐츠 -->
    <main class="content">
        <h2>메인 콘텐츠 영역</h2>
        <p>여기에 앱 주요 기능을 표시할 수 있습니다.</p>
    </main>

    <!-- ✅ 하단 내브바 -->
    <nav class="bottom-nav">
        <button class="bottom-btn" id="ai-btn" aria-label="AI 기능">
            <i data-lucide="bot"></i>
            <span>AI</span>
        </button>

        <button class="bottom-btn" id="calendar-btn" aria-label="달력">
            <i data-lucide="calendar"></i>
            <span>달력</span>
        </button>

        <button class="bottom-btn home-btn" id="home-btn" aria-label="홈">
            <div class="home-icon">
                <i data-lucide="home"></i>
            </div>
        </button>

        <button class="bottom-btn" id="mypage-btn2" aria-label="마이페이지">
            <i data-lucide="user"></i>
            <span>마이</span>
        </button>

        <button class="bottom-btn" id="settings-btn2" aria-label="설정">
            <i data-lucide="settings"></i>
            <span>설정</span>
        </button>
    </nav>


    <script src="./js/main.js">
    </script>
</body>

</html>
