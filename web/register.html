<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>한빛모아 || 회원가입</title>
    <link rel="stylesheet" href="./css/style.css">
</head>
<body>
    <main class="wrap" role="main">
        <section class="card" aria-label="로그인 화면">
            <h1 class="logo" aria-hidden="true">한빛모아</h1>

            <!-- 이메일 -->
            <label class="field" for="email">
                <input id="email" type="email" placeholder="이메일 (example@domain.com)" autocomplete="email" />
                <div class="underline" aria-hidden="true"></div>
            </label>

            <!-- 비밀번호 -->
            <label class="field" for="password">
                <input id="password" type="password" placeholder="비밀번호를 입력해주세요." autocomplete="current-password" />
                <div class="underline" aria-hidden="true"></div>
            </label>
            <!-- 비밀번호 확인-->
            <label class="field" for="password">
                <input id="passwordCheck" type="password" placeholder="비밀번호를 " autocomplete="current-password" />
                <div class="underline" aria-hidden="true"></div>
            </label>

            <!-- 버튼들 -->
            <button id="registerBtn" class="btn btn-primary">다음 단계</button>

            <div id="result"></div>

            <div class="spacer"></div>
        </section>
    </main>
    <script src="./js/register.js"></script>
</body>
</html>
