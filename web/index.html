<!doctype html>
<html lang="ko">

<head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width,initial-scale=1" />
    <title>한빛모아 || 로그인</title>

    <!-- 구글 폰트 (선택) -->
    <link href="https://fonts.googleapis.com/css2?family=Noto+Sans+KR:wght@300;400;700;900&display=swap"
        rel="stylesheet">
    <link rel="stylesheet" href="./css/style.css">

</head>

<body>

    <main class="wrap" role="main">
        <section class="card" aria-label="로그인 화면">
            <h1 class="logo" aria-hidden="true">로그인</h1>

            <!-- 이메일 -->
            <label class="field" for="email">
                <input id="email" type="email" placeholder="이메일 (example@domain.com)" autocomplete="email" />
                <div class="underline" aria-hidden="true"></div>
            </label>

            <!-- 비밀번호 -->
            <label class="field" for="password">
                <input id="password" type="password" placeholder="비밀번호" autocomplete="current-password" />
                <div class="underline" aria-hidden="true"></div>
            </label>

            <!-- 버튼들 -->
            <button id="loginBtn" class="btn btn-primary">로그인</button>
            <button id="signupBtn" class="btn btn-outline">회원가입</button>

            <div class="spacer"></div>
        </section>
    </main>

    <script src="./js/main.js"></script>
</body>

</html>
