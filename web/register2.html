<!DOCTYPE html>
<html lang="ko">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>한빛모아 || 회원가입</title>
    <link rel="stylesheet" href="./css/style.css">
    <link rel="stylesheet" href="./css/dropdown.css">
    <script src="https://code.jquery.com/jquery-3.7.1.js"
        integrity="sha256-eKhayi8LEQwp4NKxN+CfCh+3qOVUtJn3QNZ0TciWLP4=" crossorigin="anonymous"></script>
</head>

<body>
    <main class="wrap" id="frm" role="main">
        <section class="card" aria-label="회원가입 화면">
            <h1 class="logo" aria-hidden="true">회원 정보 등록</h1>

            <!-- ✅ 생년월일 선택 -->
            <div class="field birth-field">
                <label for="birth-year" class="birth-label">생년월일</label>
                <div class="birth-container">
                    <select id="birth-year" class="birth-select">
                        <option value="">년도</option>
                    </select>
                    <span class="divider"></span>
                    <select id="birth-month" class="birth-select">
                        <option value="">월</option>
                    </select>
                    <span class="divider"></span>
                    <select id="birth-day" class="birth-select">
                        <option value="">일</option>
                    </select>
                </div>
            </div>

            <!-- ✅ 시/도 + 시군구 선택 -->
            <div class="field region-field">
                <label for="region" class="region-label">사는 지역</label>
                <div class="region-container">
                    <select id="region-city" class="region-select">
                        <option value="">시/도 선택</option>
                        <option value="서울특별시">서울특별시</option>
                        <option value="부산광역시">부산광역시</option>
                        <option value="대구광역시">대구광역시</option>
                        <option value="인천광역시">인천광역시</option>
                        <option value="광주광역시">광주광역시</option>
                        <option value="대전광역시">대전광역시</option>
                        <option value="울산광역시">울산광역시</option>
                        <option value="세종특별자치시">세종특별자치시</option>
                        <option value="경기도">경기도</option>
                        <option value="강원특별자치도">강원특별자치도</option>
                        <option value="충청북도">충청북도</option>
                        <option value="충청남도">충청남도</option>
                        <option value="전북특별자치도">전북특별자치도</option>
                        <option value="전라남도">전라남도</option>
                        <option value="경상북도">경상북도</option>
                        <option value="경상남도">경상남도</option>
                        <option value="제주특별자치도">제주특별자치도</option>
                    </select>

                    <select id="region-district" class="region-select">
                        <option value="">시/군/구 선택</option>
                    </select>
                </div>
            </div>

            <!-- ✅ 회원 유형 드롭다운 -->
            <div class="dropdown">
                <button class="dropdown-btn">회원 직업 선택 ▼</button>
                <div class="dropdown-content">
                    <a href="#">학생(초,중,고)</a>
                    <a href="#">대학생</a>
                    <a href="#">대학원생</a>
                    <a href="#">자영업자</a>
                    <a href="#">전문직</a>
                    <a href="#">회사원</a>
                </div>
            </div>
            <!-- 비밀번호 확인-->
            <label class="field" for="password">
                <label for="birth-year" class="birth-label">추가를 원하는 키워드를 적어주세요</label>

                <input id="passwordCheck" type="password" placeholder="원하는 키워드를 적어주세요。"
                    autocomplete="current-password" />
                <div class="underline" aria-hidden="true"></div>
            </label>

            <button id="registerBtn" class="btn btn-primary">회원 가입</button>

            <div class="spacer"></div>
        </section>
    </main>

    <script>
        /* ✅ 생년월일 자동 채우기 */
        const yearSelect = document.getElementById("birth-year");
        const monthSelect = document.getElementById("birth-month");
        const daySelect = document.getElementById("birth-day");
        const currentYear = new Date().getFullYear();

        for (let y = currentYear; y >= 1950; y--) {
            yearSelect.insertAdjacentHTML("beforeend", `<option value="${y}">${y}년</option>`);
        }

        for (let m = 1; m <= 12; m++) {
            monthSelect.insertAdjacentHTML("beforeend", `<option value="${m}">${m}월</option>`);
        }

        

        function updateDays() {
            daySelect.innerHTML = '<option value="">일</option>';
            const year = yearSelect.value;
            const month = monthSelect.value;
            if (!year || !month) return;
            const daysInMonth = new Date(year, month, 0).getDate();
            for (let d = 1; d <= daysInMonth; d++) {
                daySelect.insertAdjacentHTML("beforeend", `<option value="${d}">${d}일</option>`);
            }
        }
        yearSelect.addEventListener("change", updateDays);
        monthSelect.addEventListener("change", updateDays);

        /* ✅ 지역 선택 (시/도 → 시군구) */
        const districts = {
            "서울특별시": [
                "강남구", "강동구", "강북구", "강서구", "관악구", "광진구",
                "구로구", "금천구", "노원구", "도봉구", "동대문구", "동작구",
                "마포구", "서대문구", "서초구", "성동구", "성북구", "송파구",
                "양천구", "영등포구", "용산구", "은평구", "종로구", "중구", "중랑구"
            ],
            "부산광역시": [
                "강서구", "금정구", "남구", "동구", "동래구", "부산진구",
                "북구", "사상구", "사하구", "서구", "수영구", "연제구",
                "영도구", "중구", "해운대구"
            ],
            "대구광역시": [
                "남구", "달서구", "동구", "북구", "서구", "수성구", "중구", "달성군"
            ],
            "인천광역시": [
                "강화군", "계양구", "남동구", "동구", "미추홀구",
                "부평구", "서구", "연수구", "옹진군", "중구"
            ],
            "광주광역시": [
                "광산구", "남구", "동구", "북구", "서구"
            ],
            "대전광역시": [
                "대덕구", "동구", "서구", "유성구", "중구"
            ],
            "울산광역시": [
                "남구", "동구", "북구", "중구", "울주군"
            ],
            "세종특별자치시": [
                "세종시 전체"
            ],
            "경기도": [
                "가평군", "고양시", "과천시", "광명시", "광주시", "구리시",
                "군포시", "김포시", "남양주시", "동두천시", "부천시",
                "성남시", "수원시", "시흥시", "안산시", "안성시",
                "안양시", "양주시", "양평군", "여주시", "연천군",
                "오산시", "용인시", "의왕시", "의정부시", "이천시",
                "파주시", "평택시", "포천시", "하남시", "화성시"
            ],
            "강원특별자치도": [
                "강릉시", "고성군", "동해시", "삼척시", "속초시",
                "양구군", "양양군", "영월군", "원주시", "인제군",
                "정선군", "철원군", "춘천시", "태백시", "평창군",
                "홍천군", "화천군", "횡성군"
            ],
            "충청북도": [
                "괴산군", "단양군", "보은군", "영동군", "옥천군",
                "음성군", "제천시", "증평군", "진천군", "청주시", "충주시"
            ],
            "충청남도": [
                "계룡시", "공주시", "금산군", "논산시", "당진시",
                "보령시", "부여군", "서산시", "서천군", "아산시",
                "예산군", "천안시", "청양군", "태안군", "홍성군"
            ],
            "전북특별자치도": [
                "고창군", "군산시", "김제시", "남원시", "무주군",
                "부안군", "순창군", "완주군", "익산시", "임실군",
                "장수군", "전주시", "정읍시", "진안군"
            ],
            "전라남도": [
                "강진군", "고흥군", "곡성군", "광양시", "구례군",
                "나주시", "담양군", "목포시", "무안군", "보성군",
                "순천시", "신안군", "여수시", "영광군", "영암군",
                "완도군", "장성군", "장흥군", "진도군", "함평군",
                "해남군", "화순군"
            ],
            "경상북도": [
                "경산시", "경주시", "고령군", "구미시", "군위군",
                "김천시", "문경시", "봉화군", "상주시", "성주군",
                "안동시", "영덕군", "영양군", "영주시", "영천시",
                "예천군", "울릉군", "울진군", "의성군", "청도군",
                "청송군", "칠곡군", "포항시"
            ],
            "경상남도": [
                "거제시", "거창군", "고성군", "김해시", "남해군",
                "밀양시", "사천시", "산청군", "양산시", "의령군",
                "진주시", "창녕군", "창원시", "통영시", "하동군",
                "함안군", "함양군", "합천군"
            ],
            "제주특별자치도": [
                "제주시", "서귀포시"
            ]
        };


        const citySelect = document.getElementById("region-city");
        const districtSelect = document.getElementById("region-district");

        citySelect.addEventListener("change", () => {
            const city = citySelect.value;
            districtSelect.innerHTML = '<option value="">시/군/구 선택</option>';
            if (districts[city]) {
                districts[city].forEach(d => {
                    districtSelect.insertAdjacentHTML("beforeend", `<option value="${d}">${d}</option>`);
                });
            }
        });

        /* ✅ 회원 유형 드롭다운 */
        const dropdownBtn = document.querySelector('.dropdown-btn');
        const dropdownContent = document.querySelector('.dropdown-content');
        dropdownBtn.addEventListener('click', () => {
            dropdownContent.classList.toggle('show');
        });
        window.addEventListener('click', (e) => {
            if (!e.target.matches('.dropdown-btn')) {
                dropdownContent.classList.remove('show');
            }
        });
    </script>
</body>

</html>
