<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>한빛모아 || 회원가입</title>
    <link rel="stylesheet" href="./css/style.css">
    <link rel="stylesheet" href="./css/dropdown.css">
    <script src="https://code.jquery.com/jquery-3.7.1.js" integrity="sha256-eKhayi8LEQwp4NKxN+CfCh+3qOVUtJn3QNZ0TciWLP4=" crossorigin="anonymous"></script>
</head>
<body>
    <main class="wrap" id="frm" role="main">
        <section class="card" aria-label="로그인 화면">
            <h1 class="logo" aria-hidden="true">회원가입</h1>

            <label class="field" for="email">
                <input id="name" type="text" placeholder="이름" autocomplete="email" />
                <div class="underline" aria-hidden="true"></div>
            </label>

            <!-- 이메일 -->
            <label class="field" for="email">
                <input id="email" type="email" placeholder="이메일 (example@domain.com)" autocomplete="email" />
                <div class="underline" aria-hidden="true"></div>
            </label>

            <!-- 비밀번호 -->
            <label class="field" for="password">
                <input id="password" type="password" placeholder="비밀번호" autocomplete="current-password" />
                <div class="underline" aria-hidden="true"></div>
            </label>
            <!-- 비밀번호 확인-->
            <label class="field" for="password">
                <input id="passwordCheck" type="password" placeholder="비밀번호를 다시 입력해주세요." autocomplete="current-password" />
                <div class="underline" aria-hidden="true"></div>
            </label>

            
            <!-- ✅ 생년월일 선택 -->
            <div class="field birth-field" style="margin-top: 15px;">
                <label for="birth-year" class="birth-label">생년월일</label>
                <div class="birth-container">
                    <select id="birth-year" class="birth-select">
                        <option value="">년도</option>
                    </select>
                    <span class="divider"></span>
                    <select id="birth-month" class="birth-select">
                        <option value="">월</option>
                    </select>
                    <span class="divider"></span>
                    <select id="birth-day" class="birth-select">
                        <option value="">일</option>
                    </select>
                </div>
            </div>

            <!-- ✅ 시/도 + 시군구 선택 -->
            <div class="field region-field">
                <label for="region" class="region-label">사는 지역</label>
                <div class="region-container">
                    <select id="region-city" class="region-select">
                        <option value="">시/도 선택</option>
                        <option value="서울특별시">서울특별시</option>
                        <option value="부산광역시">부산광역시</option>
                        <option value="대구광역시">대구광역시</option>
                        <option value="인천광역시">인천광역시</option>
                        <option value="광주광역시">광주광역시</option>
                        <option value="대전광역시">대전광역시</option>
                        <option value="울산광역시">울산광역시</option>
                        <option value="세종특별자치시">세종특별자치시</option>
                        <option value="경기도">경기도</option>
                        <option value="강원특별자치도">강원특별자치도</option>
                        <option value="충청북도">충청북도</option>
                        <option value="충청남도">충청남도</option>
                        <option value="전북특별자치도">전북특별자치도</option>
                        <option value="전라남도">전라남도</option>
                        <option value="경상북도">경상북도</option>
                        <option value="경상남도">경상남도</option>
                        <option value="제주특별자치도">제주특별자치도</option>
                    </select>

                    <select id="region-district" class="region-select">
                        <option value="">시/군/구 선택</option>
                    </select>
                </div>
            </div>

            <!-- ✅ 회원 직업 선택 -->
            <div class="field job-field">
                <label for="job-select" class="job-label">회원 직업</label>
                <div class="job-container">
                    <select id="job-select" class="job-select">
                        <option value="">직업을 선택하세요</option>
                        <option value="학생(초,중,고)">학생(초,중,고)</option>
                        <option value="대학생">대학생</option>
                        <option value="대학원생">대학원생</option>
                        <option value="자영업자">자영업자</option>
                        <option value="전문직">전문직</option>
                        <option value="회사원">회사원</option>
                    </select>
                </div>
            </div>

            <div class="field keyword-field">
                <label for="keyword-input" class="birth-label">추가를 원하는 키워드를 적어주세요</label>
                <div class="keyword-container">
                    <input id="keyword-input" type="text" placeholder="원하는 키워드를 입력하세요" />
                    <button id="addKeywordBtn" type="button" class="btn-mini">추가</button>
                </div>
                <ul id="keyword-list" class="keyword-list"></ul>
            </div>

            <!-- 버튼들 -->
            <button id="registerBtn" class="btn btn-primary">다음 단계</button>


            <div id="result"></div>

            <div class="spacer"></div>
        </section>
    </main>
    <script src="./js/register.js"></script>
</body>
</html>
