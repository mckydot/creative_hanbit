<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>한빛 모아 || AI</title>
    <link rel="stylesheet" href="css/style.css">
    <link rel="stylesheet" href="css/ai.css">
    <script src="https://unpkg.com/lucide@latest"></script>
</head>
<body>
    <!-- ✅ 상단 내브바 -->
    <header class="navbar">
        <div class="navbar-left">
            <h1 class="app-name">한빛모아</h1>
        </div>

        <div class="navbar-right">
            <button class="icon-btn" id="mypage-btn" aria-label="마이페이지">
                <i data-lucide="user"></i>
            </button>
            <button class="icon-btn" id="settings-btn" aria-label="설정">
                <i data-lucide="settings"></i>
            </button>
        </div>
    </header>

    

    <!-- ✅ 하단 내브바 -->
    <nav class="bottom-nav">
        <button class="bottom-btn" id="ai-btn" aria-label="AI 기능">
            <i data-lucide="bot"></i>
            <span>AI</span>
        </button>

        <button class="bottom-btn" id="calendar-btn" aria-label="달력">
            <i data-lucide="calendar"></i>
            <span>달력</span>
        </button>

        <button class="bottom-btn home-btn" id="home-btn" aria-label="홈">
            <div class="home-icon">
                <i data-lucide="home"></i>
            </div>
        </button>

        <button class="bottom-btn" id="mypage-btn2" aria-label="마이페이지">
            <i data-lucide="user"></i>
            <span>마이</span>
        </button>

        <button class="bottom-btn" id="settings-btn2" aria-label="설정">
            <i data-lucide="settings"></i>
            <span>설정</span>
        </button>
    </nav>

    <script src="js/ai.js"></script>
</body>
</html>
